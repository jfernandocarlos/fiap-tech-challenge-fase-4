[tool.poetry]
name = "credit-scoring-observability"
version = "1.0.0"
description = "Observabilidade, drift e governança para credit scoring em produção"
authors = ["José Fernando Carlos <j.fernandocarlos@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "credit", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pydantic-settings = "2.6.1"
python-dotenv = "1.0.1"
structlog = "24.4.0"
pyyaml = "6.0.2"
pandas = "2.2.3"
numpy = "1.26.4"
pandera = "0.20.4"
scikit-learn = "1.5.2"
joblib = "1.4.2"

[tool.poetry.group.dev.dependencies]
ruff = "0.8.4"
pytest = "8.3.4"
pre-commit = "4.0.1"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["credit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
pythonpath = ["src", "."]
